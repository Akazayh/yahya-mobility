<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAHYA Mobility - Mon profil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .page-section {
            padding: 8rem 0 4rem;
        }

        .page-title {
            font-family: var(--font-heading);
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            text-align: center;
            margin-bottom: var(--space-3xl);
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .page-title i {
            color: var(--accent);
            margin-right: var(--space-sm);
        }

        .profile-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: var(--space-2xl);
            border: 1px solid var(--border);
            margin-bottom: var(--space-xl);
            box-shadow: var(--shadow-md);
            transition: border-color var(--duration) var(--ease), box-shadow var(--duration) var(--ease);
        }

        .profile-card:hover {
            border-color: var(--border-accent);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }

        .profile-card-header {
            display: flex;
            align-items: center;
            gap: var(--space-lg);
            margin-bottom: var(--space-xl);
            padding-bottom: var(--space-lg);
            border-bottom: 1px solid var(--border);
        }

        .profile-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .profile-avatar-header h2 {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            margin-bottom: var(--space-xs);
        }

        .profile-avatar-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-lg);
        }

        .form-group {
            margin-bottom: 0;
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-group label .label-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            padding: 0.1rem 0.45rem;
            border-radius: var(--radius-sm);
            margin-left: var(--space-xs);
            vertical-align: middle;
        }

        .form-group input {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 0.8rem 1rem;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color var(--duration) var(--ease), box-shadow var(--duration) var(--ease);
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-group input[readonly] {
            opacity: 0.6;
            cursor: not-allowed;
            background: rgba(255,255,255,0.02);
        }

        .form-actions {
            display: flex;
            gap: var(--space-md);
            margin-top: var(--space-xl);
        }



        .password-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: var(--space-2xl);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            transition: border-color var(--duration) var(--ease), box-shadow var(--duration) var(--ease);
        }

        .password-card:hover {
            border-color: var(--border-accent);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }

        .password-card-header {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            margin-bottom: var(--space-xl);
            padding-bottom: var(--space-lg);
            border-bottom: 1px solid var(--border);
        }

        .password-card-header .icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--green);
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .password-card-header h3 {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            color: var(--text-primary);
        }



        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .profile-card-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="nav">
            <a class="logo" href="accueil.html">
                <img src="../assets/images/logo.png" alt="YAHYA Mobility" class="logo-img">
            </a>
            <div class="nav-toggle" id="navToggle" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="accueil.html">Accueil</a>
                <a href="cars.html">Vehicules</a>
                <a href="mes-reservations.html">Mes reservations</a>
                <a href="mes-contrats.html">Mes contrats</a>
                <a href="profil.html">Profil</a>
                <a href="about.html">A propos</a>
                <span id="userMenu"></span>
            </div>
        </div>
    </header>

    <main class="page-section">
        <div class="container">
            <h1 class="page-title"><i class="ri-user-line"></i> Mon profil</h1>

            <div class="profile-card">
                <div class="profile-card-header">
                    <div class="profile-avatar">
                        <i class="ri-user-3-line"></i>
                    </div>
                    <div class="profile-avatar-header">
                        <h2 id="profileDisplayName">Mon profil</h2>
                        <p>Gerez vos informations personnelles</p>
                    </div>
                </div>
                <form id="profileForm">
                    <div class="form-grid">
                        <div class="form-group"><label>Nom</label><input type="text" id="nom"></div>
                        <div class="form-group"><label>Prenom</label><input type="text" id="prenom"></div>
                        <div class="form-group"><label>Email</label><input type="email" id="email"></div>
                        <div class="form-group"><label>Telephone</label><input type="tel" id="telephone"></div>
                        <div class="form-group full-width"><label>Adresse</label><input type="text" id="adresse"></div>
                        <div class="form-group"><label>CIN <span class="label-tag">non modifiable</span></label><input type="text" id="cin" readonly></div>
                        <div class="form-group"><label>N permis <span class="label-tag">non modifiable</span></label><input type="text" id="numPermis" readonly></div>
                        <div class="form-group"><label>Date d obtention du permis</label><input type="date" id="datePermis"></div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-save"><i class="ri-save-line"></i> Enregistrer les modifications</button>
                        <button type="button" id="logoutBtn" class="btn-logout"><i class="ri-logout-box-line"></i> Deconnexion</button>
                    </div>
                </form>
            </div>

            <div class="password-card">
                <div class="password-card-header">
                    <div class="icon-circle">
                        <i class="ri-lock-password-line"></i>
                    </div>
                    <h3>Changer votre mot de passe</h3>
                </div>
                <form id="changePwdForm">
                    <div class="form-grid">
                        <div class="form-group full-width"><label>Mot de passe actuel</label><input type="password" id="oldPassword" required></div>
                        <div class="form-group"><label>Nouveau mot de passe</label><input type="password" id="newPassword" required></div>
                        <div class="form-group"><label>Confirmer le nouveau mot de passe</label><input type="password" id="confirmPassword" required></div>
                    </div>
                    <button type="submit" class="btn-change-pwd"><i class="ri-lock-password-line"></i> Changer le mot de passe</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container text-center">
            <p style="color:var(--text-muted);">&copy; 2026 YAHYA Mobility - Location de voitures</p>
        </div>
    </footer>

    <script>
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        navToggle.addEventListener('click', () => {
            navToggle.classList.toggle('active');
            navLinks.classList.toggle('open');
        });
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navToggle.classList.remove('active');
                navLinks.classList.remove('open');
            });
        });
    </script>

    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
    // ✅ FIX 1: updateUserInterface defined at top level, not inside DOMContentLoaded
    function updateUserInterface() {
        const currentUser = getCurrentClient();
        const userMenu = document.getElementById('userMenu');
        if (!userMenu) return;
        if (currentUser) {
            userMenu.innerHTML = `
                <span style="margin-right:15px;color:var(--accent);">${currentUser.prenom} ${currentUser.nom}</span>
                <button id="logoutBtnHeader" class="btn btn-outline" style="padding:0.45rem 1.2rem;font-size:0.88rem;">Deconnexion</button>
            `;
            document.getElementById('logoutBtnHeader')?.addEventListener('click', () => {
                localStorage.removeItem('currentClient');
                window.location.href = "login.html";
            });
        } else {
            userMenu.innerHTML = `<a href="login.html" class="btn btn-auth">Se connecter</a>`;
            const protectedLinks = ['mes-reservations.html', 'mes-contrats.html', 'profil.html'];
            document.querySelectorAll('.nav-links a').forEach(link => {
                if (protectedLinks.includes(link.getAttribute('href'))) link.style.display = 'none';
            });
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const currentClient = getCurrentClient();
        if (!currentClient) {
            // ✅ FIX 1: updateUserInterface() now exists here because it's defined above
            updateUserInterface();
            alert("Veuillez vous connecter.");
            window.location.href = "login.html";
            return;
        }

        updateUserInterface();

        document.getElementById('profileDisplayName').textContent = `${currentClient.prenom} ${currentClient.nom}`;

        // Fill form
        document.getElementById('nom').value = currentClient.nom || '';
        document.getElementById('prenom').value = currentClient.prenom || '';
        document.getElementById('email').value = currentClient.email || '';
        document.getElementById('telephone').value = currentClient.telephone || '';
        document.getElementById('adresse').value = currentClient.adresse || '';
        document.getElementById('cin').value = currentClient.cin || '';
        document.getElementById('numPermis').value = currentClient.numPermis || '';
        document.getElementById('datePermis').value = currentClient.datePermis || '';

        // Save profile changes
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            currentClient.nom = document.getElementById('nom').value;
            currentClient.prenom = document.getElementById('prenom').value;
            currentClient.email = document.getElementById('email').value;
            currentClient.telephone = document.getElementById('telephone').value;
            currentClient.adresse = document.getElementById('adresse').value;
            currentClient.datePermis = document.getElementById('datePermis').value;

            let clients = JSON.parse(localStorage.getItem('clients') || '[]');
            const index = clients.findIndex(c => c.id === currentClient.id);
            if (index !== -1) {
                clients[index] = currentClient;
                localStorage.setItem('clients', JSON.stringify(clients));
                localStorage.setItem('currentClient', JSON.stringify(currentClient));
                alert("Profil mis a jour !");
                document.getElementById('profileDisplayName').textContent = `${currentClient.prenom} ${currentClient.nom}`;
            } else {
                alert("Erreur : utilisateur non trouve.");
            }
        });

        // ✅ FIX 2: Password change now hashes before comparing and storing
        document.getElementById('changePwdForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const oldPwd = document.getElementById('oldPassword').value;
            const newPwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;

            const hashedOld = await hashPassword(oldPwd);
            if (hashedOld !== currentClient.password) {
                alert("Mot de passe actuel incorrect.");
                return;
            }
            if (newPwd !== confirmPwd) {
                alert("Le nouveau mot de passe et sa confirmation ne correspondent pas.");
                return;
            }
            if (newPwd.length < 4) {
                alert("Le nouveau mot de passe doit contenir au moins 4 caracteres.");
                return;
            }

            const hashedNew = await hashPassword(newPwd);
            currentClient.password = hashedNew; // ✅ store as hash

            let clients = JSON.parse(localStorage.getItem('clients') || '[]');
            const index = clients.findIndex(c => c.id === currentClient.id);
            if (index !== -1) {
                clients[index] = currentClient;
                localStorage.setItem('clients', JSON.stringify(clients));
                localStorage.setItem('currentClient', JSON.stringify(currentClient));
                alert("Mot de passe change avec succes !");
                document.getElementById('changePwdForm').reset();
            } else {
                alert("Erreur lors du changement.");
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('currentClient');
            window.location.href = "login.html";
        });

        if (typeof hideCurrentPageLink === 'function') hideCurrentPageLink();
    });
    </script>
</body>
</html>
